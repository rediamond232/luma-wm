[workspace]
members = [
    "crates/core",
    "crates/compositor",
    "crates/control",
    "crates/game-capture-protocol",
    "crates/game-capture-muxer",
    "crates/recorder",
    "crates/shell",
    "crates/shell-sctk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rediamond232/luma-wm"

[profile.release]
lto = "thin"
codegen-units = 1
