terminal = ["kitty"]
startup = []
rules = []

[performance]
# Keep desktop visuals, then automatically use the lowest-overhead fullscreen
# path and VRR on compatible outputs. Runtime override: wmctl performance profile.
profile = "auto"
fullscreen_vrr = true

[theme]
background = "#1b1b14"
foreground = "#fff3d1"
accent = "#e7bd58"
muted = "#aeb286"
font = "Noto Sans"
font_size = 14
gap = 8
border = 1
shadow_size = 10
shadow_opacity = 0.3
radius = 14.0
opacity = 0.94
blur = false
blur_passes = 2
animation_ms = 140
reduced_motion = false

[layout]
mode = "master"
master_ratio = 0.55
workspaces = 9

[input]
layout = "us"
variant = ""
options = ""
repeat_delay = 200
repeat_rate = 25
natural_scroll = false
tap_to_click = true
pointer_accel = 0.0
mouse_modifier = "Super"
follow_mouse = true

[bindings]
"Print" = "screenshot"
"Super+1" = "workspace 1"
"Super+2" = "workspace 2"
"Super+3" = "workspace 3"
"Super+4" = "workspace 4"
"Super+5" = "workspace 5"
"Super+6" = "workspace 6"
"Super+7" = "workspace 7"
"Super+8" = "workspace 8"
"Super+9" = "workspace 9"
"Super+Down" = "focus down"
"Super+Escape" = "lock"
"Super+Left" = "focus left"
"Super+Return" = "terminal"
"Super+Right" = "focus right"
"Super+Alt+1" = "send 1"
"Super+Alt+2" = "send 2"
"Super+Alt+3" = "send 3"
"Super+Alt+4" = "send 4"
"Super+Alt+5" = "send 5"
"Super+Alt+6" = "send 6"
"Super+Alt+7" = "send 7"
"Super+Alt+8" = "send 8"
"Super+Alt+9" = "send 9"
"Super+Shift+Down" = "move down"
"Super+Shift+Left" = "move left"
"Super+q" = "close"
"Super+Shift+R" = "reload"
"Super+Shift+Right" = "move right"
"Super+Shift+Up" = "move up"
"Super+Shift+asciitilde" = "scratchpad send"
"Super+Shift+space" = "floating"
"Super+Up" = "focus up"
"Super+equal" = "ratio 0.05"
"Super+f" = "fullscreen"
"Super+grave" = "scratchpad show"
"Super+m" = "layout monocle"
"Super+minus" = "ratio -0.05"
"Super+Space" = "launcher"
"Super+t" = "layout master"
"Super+e" = "launch dolphin"
"Super+w" = "launch firefox"
"Super+Alt+R" = "recorder"
"Super+F8" = "recorder replay-save"
"Super+F9" = "recorder toggle"
"Super+F10" = "recorder pause"

[wallpaper]
path = "/home/lev/Pictures/Wallpapers/random_wallpaper.jpg"
kind = "static"
fit = "fill"
fps = 30
pause_on_battery = true

[wallpaper.outputs]

[recorder]
# HDR uses a 10-bit BT.2100 PQ HEVC Main10 stream; set codec = "hevc" too.
hdr = true
# Screen capture composites the desktop, so keep its ceiling conservative.
# Direct graphics-API profiles and runtime OpenGL injection intercept presents
# before the compositor. Runtime injection uses `fps`; profiles use their own.
screen_fps = 240
fps = 480
codec = "hevc"
quality = 16
output_width = 2560
output_height = 1440
output_directory = "~/Videos/Luma"
container = "mp4"
cursor = true
desktop_audio = "default_output"
microphone = "default_input"

# Add an explicit renderer command to use the launch-profile choice. It can
# exec the OpenGL renderer directly, or launch a child renderer selected by
# its exact Linux process name (`comm`), such as Java for Minecraft clients.
# [[recorder.game_profiles]]
# name = "game-opengl"
# api = "opengl"
# command = ["/absolute/path/to/game-binary"]
# fps = 480
# # Optional: allows the launcher above to fork this renderer. The preload hook
# # remains inert in every other launcher child.
# target_process_name = "java"

# Lunar starts its Minecraft JVM as a child of the Electron launcher. After
# restarting into the build that supports `target_process_name`, uncomment:
# [[recorder.game_profiles]]
# name = "lunar-opengl"
# api = "opengl"
# command = ["/usr/bin/env", "DESKTOPINTEGRATION=false", "/usr/bin/lunarclient", "--no-sandbox"]
# fps = 480
# target_process_name = "java"

# Vulkan profiles launch the renderer through Luma's explicit Vulkan layer.
# Runtime injection is OpenGL-only because Vulkan dispatch chains are fixed
# when the instance and device are created.
# [[recorder.game_profiles]]
# name = "game-vulkan"
# api = "vulkan"
# command = ["your-vulkan-game"]
# fps = 480

[outputs]
# Configure a monitor by its connector name. `hz = 0` keeps it automatic.
 [outputs.DP-1]
 width = 2560
 height = 1440
 hz = 360
 scale = 1.0
 x = 0
 y = 0
# HDR enables 10-bit scanout and BT.2020/PQ connector signaling.
hdr = false

[shell]
enabled = true
backend = "sctk"
do_not_disturb = false
position = "top"
height = 42
modules = [
    "workspaces",
    "title",
    "audio",
    "network",
    "bluetooth",
    "media",
    "tray",
    "battery",
    "notifications",
    "clock",
    "power",
]
