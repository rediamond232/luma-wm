terminal = ["kitty"]
startup = []
rules = []

[theme]
background = "#1b1b14"
foreground = "#fff3d1"
accent = "#e7bd58"
muted = "#aeb286"
font = "sans-serif"
font_size = 13
gap = 8
border = 1
shadow_size = 16
shadow_opacity = 0.3
radius = 12.0
opacity = 0.88
blur = true
blur_passes = 3
animation_ms = 140
reduced_motion = false

[layout]
mode = "master"
master_ratio = 0.55
workspaces = 9

[input]
layout = "us"
variant = ""
options = ""
repeat_delay = 200
repeat_rate = 25
natural_scroll = false
tap_to_click = true
pointer_accel = 0.0
mouse_modifier = "Super"

[bindings]
"Print" = "screenshot"
"Super+1" = "workspace 1"
"Super+2" = "workspace 2"
"Super+3" = "workspace 3"
"Super+4" = "workspace 4"
"Super+5" = "workspace 5"
"Super+6" = "workspace 6"
"Super+7" = "workspace 7"
"Super+8" = "workspace 8"
"Super+9" = "workspace 9"
"Super+Down" = "focus down"
"Super+Escape" = "lock"
"Super+Left" = "focus left"
"Super+Return" = "terminal"
"Super+Right" = "focus right"
"Super+Alt+1" = "send 1"
"Super+Alt+2" = "send 2"
"Super+Alt+3" = "send 3"
"Super+Alt+4" = "send 4"
"Super+Alt+5" = "send 5"
"Super+Alt+6" = "send 6"
"Super+Alt+7" = "send 7"
"Super+Alt+8" = "send 8"
"Super+Alt+9" = "send 9"
"Super+Shift+Down" = "move down"
"Super+Shift+Left" = "move left"
"Super+q" = "close"
"Super+Shift+R" = "reload"
"Super+Shift+Right" = "move right"
"Super+Shift+Up" = "move up"
"Super+Shift+asciitilde" = "scratchpad send"
"Super+Shift+space" = "floating"
"Super+Up" = "focus up"
"Super+equal" = "ratio 0.05"
"Super+f" = "fullscreen"
"Super+grave" = "scratchpad show"
"Super+m" = "layout monocle"
"Super+minus" = "ratio -0.05"
"Super+Space" = "launcher"
"Super+t" = "layout master"
"Super+e" = "launch thunar"
"Super+w" = "launch firefox"

[wallpaper]
path = "/home/lev/Pictures/Wallpapers/random_wallpaper.jpg"
kind = "static"
fit = "fill"
fps = 30
pause_on_battery = true

[wallpaper.outputs]

[outputs]
# Configure a monitor by its connector name. `hz = 0` keeps it automatic.
 [outputs.DP-1]
 width = 2560
 height = 1440
 hz = 360
 scale = 1.0
 x = 0
 y = 0

[shell]
enabled = true
backend = "sctk"
do_not_disturb = false
position = "top"
height = 36
modules = [
    "workspaces",
    "title",
    "audio",
    "network",
    "bluetooth",
    "media",
    "tray",
    "battery",
    "notifications",
    "clock",
]
