# Luma's session lock theme. Keep this self-contained: do not import personal
# Hyprland configuration or run periodic shell commands from the lock screen.

background {
    color = rgba(27, 27, 20, 1.0)
    blur_passes = 0
    noise = 0
}

label {
    text = LUMA
    color = rgba(231, 189, 88, 1.0)
    font_size = 22
    font_family = Noto Sans
    position = 0, 104
    halign = center
    valign = center
}

input-field {
    size = 360, 58
    outline_thickness = 2
    rounding = 18
    outer_color = rgba(231, 189, 88, 0.92)
    inner_color = rgba(35, 36, 27, 1.0)
    font_color = rgba(255, 243, 209, 1.0)
    font_family = Noto Sans
    placeholder_text = Enter password
    fade_on_empty = false
    check_color = rgba(174, 178, 134, 1.0)
    fail_color = rgba(238, 105, 93, 1.0)
    position = 0, 0
    halign = center
    valign = center
}

label {
    text = Press Enter to unlock
    color = rgba(174, 178, 134, 1.0)
    font_size = 14
    font_family = Noto Sans
    position = 0, -92
    halign = center
    valign = center
}
